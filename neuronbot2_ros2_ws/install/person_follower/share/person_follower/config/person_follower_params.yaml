# Parâmetros de configuração para person_follower_node

person_follower:
  ros__parameters:
    # Modelo YOLO a usar
    # Opções: yolov8n.pt (rápido), yolov8s.pt, yolov8m.pt, yolov8l.pt (preciso)
    yolo_model: "yolov8n.pt"
    
    # Limiar de confiança para detecção de pessoa (0.0 - 1.0)
    # Valores menores: mais sensível, mais falsos positivos
    # Valores maiores: mais restritivo, pode perder detecções
    confidence_threshold: 0.5
    
    # Tópicos da câmera
    camera_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    
    # Distância alvo da pessoa em metros
    # O robô tentará manter essa distância da pessoa detectada
    target_distance: 1.5
    
    # Intervalo mínimo entre atualizações de navegação (segundos)
    # Valores menores: mais responsivo mas pode ser errático
    # Valores maiores: mais suave mas menos responsivo
    min_detection_interval: 1.0


